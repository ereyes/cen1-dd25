<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CEN 1 - cours Web Graphique - Galerie des travaux d'étudiants</title>
  <meta name="description" content="Galerie des travaux d'étudiants." />
  <style>
    :root {
      color-scheme: light;
      --primary: #435f91;
      --on-primary: #ffffff;
      --primary-container: #d8e2ff;
      --on-primary-container: #001a42;
      --secondary: #5a6072;
      --surface: #fbf8ff;
      --surface-container-low: #f5f1fa;
      --surface-container: #eeeaf2;
      --surface-container-high: #e8e4ee;
      --on-surface: #1b1b20;
      --on-surface-variant: #47464f;
      --outline: #777680;
      --outline-variant: #cac4d0;
      --scrim: rgba(0, 0, 0, 0.56);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --shadow-1: 0 1px 2px rgba(17, 24, 39, 0.08), 0 2px 8px rgba(17, 24, 39, 0.06);
      --shadow-2: 0 10px 28px rgba(17, 24, 39, 0.12), 0 3px 10px rgba(17, 24, 39, 0.08);
      --content-width: 1320px;
      --gap: clamp(16px, 2vw, 24px);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Roboto, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(190, 190, 190, 0.2), transparent 34rem),
        linear-gradient(180deg, #ffffff 0%, var(--surface) 44rem);
      color: var(--on-surface);
      line-height: 1.5;
    }

    img {
      display: block;
      max-width: 100%;
    }

    button,
    a {
      font: inherit;
    }

    a {
      color: inherit;
    }

    .shell {
      width: min(100% - clamp(28px, 5vw, 72px), var(--content-width));
      margin-inline: auto;
    }

    header {
      padding: clamp(32px, 7vw, 72px) 0 clamp(24px, 4vw, 40px);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--primary);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 920px;
      font-size: clamp(2rem, 5vw, 4.5rem);
      line-height: 0.98;
      letter-spacing: -0.055em;
    }

    .intro {
      margin: 18px 0 0;
      max-width: 720px;
      color: var(--on-surface-variant);
      font-size: clamp(1rem, 1.7vw, 1.16rem);
    }

    .count-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      color: var(--on-primary-container);
      background: var(--primary-container);
      font-weight: 700;
      white-space: nowrap;
      box-shadow: inset 0 0 0 1px rgba(67, 95, 145, 0.12);
    }

    main {
      padding-bottom: 64px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
      gap: var(--gap);
    }

    .card {
      display: flex;
      min-width: 0;
      overflow: hidden;
      flex-direction: column;
      border: 1px solid rgba(202, 196, 208, 0.72);
      border-radius: var(--radius-md);
      background: color-mix(in srgb, var(--surface-container-low) 82%, white);
      box-shadow: var(--shadow-1);
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--primary) 36%, var(--outline-variant));
      box-shadow: var(--shadow-2);
    }

    .thumb-button {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      text-align: inherit;
    }

    .thumb {
      position: relative;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(216, 226, 255, 0.8), rgba(238, 234, 242, 0.92)),
        var(--surface-container);
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      transition: transform 260ms ease;
    }

    .card:hover .thumb img {
      transform: scale(1.03);
    }

    .image-fallback {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      padding: 24px;
      color: var(--on-primary-container);
      text-align: center;
      font-weight: 700;
    }

    .thumb.is-missing .image-fallback {
      display: grid;
    }

    .thumb.is-missing img {
      opacity: 0;
    }

    .content {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 18px;
      padding: 20px;
    }

    .project-title {
      margin: 0;
      font-size: 1.14rem;
      line-height: 1.18;
      letter-spacing: -0.018em;
    }

    .student {
      margin: 8px 0 0;
      color: var(--on-surface-variant);
      font-size: 0.96rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: auto;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid transparent;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 700;
      transition: background 160ms ease, box-shadow 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .button:focus-visible,
    .thumb-button:focus-visible,
    .dialog-close:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--primary) 70%, white);
      outline-offset: 3px;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .button.filled {
      color: var(--on-primary);
      background: var(--primary);
      box-shadow: 0 1px 2px rgba(17, 24, 39, 0.14);
    }

    .button.filled:hover {
      box-shadow: 0 4px 12px rgba(17, 24, 39, 0.18);
    }

    .button.tonal {
      color: var(--on-primary-container);
      background: var(--primary-container);
      border-color: rgba(67, 95, 145, 0.12);
    }

    dialog {
      width: min(1180px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      padding: 0;
      border: 0;
      border-radius: var(--radius-xl);
      background: var(--surface);
      color: var(--on-surface);
      box-shadow: 0 26px 72px rgba(0, 0, 0, 0.32);
      overflow: hidden;
    }

    dialog::backdrop {
      background: var(--scrim);
      backdrop-filter: blur(5px);
    }

    .dialog-bar {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px 14px;
      border-bottom: 1px solid var(--outline-variant);
      background: color-mix(in srgb, var(--surface) 90%, white);
    }

    .dialog-heading {
      min-width: 0;
    }

    .dialog-title {
      margin: 0;
      font-size: 1rem;
      line-height: 1.2;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dialog-student {
      margin: 4px 0 0;
      color: var(--on-surface-variant);
      font-size: 0.92rem;
    }

    .dialog-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .dialog-close {
      display: inline-grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 999px;
      background: var(--surface-container);
      color: var(--on-surface);
      cursor: pointer;
      font-size: 1.35rem;
      line-height: 1;
    }

    .dialog-body {
      max-height: calc(100vh - 124px);
      overflow: auto;
      background:
        linear-gradient(45deg, rgba(202, 196, 208, 0.42) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(202, 196, 208, 0.42) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(202, 196, 208, 0.42) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(202, 196, 208, 0.42) 75%);
      background-color: #ffffff;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
      background-size: 24px 24px;
    }

    .dialog-body img {
      width: min(100%, 1100px);
      height: auto;
      margin: 0 auto;
      background: white;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 760px) {
      .hero {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .count-chip {
        width: fit-content;
      }

      .dialog-bar {
        align-items: flex-start;
        flex-direction: column;
      }

      .dialog-actions {
        width: 100%;
        justify-content: space-between;
      }

      .dialog-title {
        white-space: normal;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="shell hero">
      <div>
        <p class="eyebrow">M1 CEN, Univ. P8</p>
        <h1>Galerie devoirs Web Graphique et Design de données</h1>
        <p class="intro">Captures d'écran, titres, noms et liens directs vers chaque devoir ou dépôt en ligne.</p>
      </div>
      <div class="count-chip" aria-label="16 student projects">16 devoirs</div>
    </div>
  </header>

  <main class="shell">
    <section class="gallery" id="gallery" aria-label="Student works gallery"></section>
  </main>

  <dialog id="viewer" aria-labelledby="viewer-title">
    <div class="dialog-bar">
      <div class="dialog-heading">
        <h2 class="dialog-title" id="viewer-title"></h2>
        <p class="dialog-student" id="viewer-student"></p>
      </div>
      <div class="dialog-actions">
        <a class="button tonal" id="viewer-live-link" target="_blank" rel="noopener noreferrer">Open live Version live</a>
        <button class="dialog-close" id="viewer-close" type="button" aria-label="Close full view">×</button>
      </div>
    </div>
    <div class="dialog-body">
      <img id="viewer-image" src="" alt="" />
    </div>
  </dialog>

  <script>
    const basePath = './';

    const projects = [
      {
        image: 'Screenshot 2026-03-07 at 15-35-24.png',
        title: 'League of Legends',
        url: 'https://github.com/Victor-CHRTM/DataAnalyseLoL',
        student: 'Victor'
      },
      {
        image: 'Screenshot 2026-03-07 at 15-39-51.png',
        title: 'Évolution des couleurs de voitures (1950-2025)',
        url: 'https://github.com/lisadessommes05-star/Rendu-Projet-Graphisme-Data',
        student: 'Lisa'
      },
      {
        image: "Screenshot 2026-03-07 at 15-40-41.png",
        title: 'Encyclopoisson',
        url: 'https://aurorexdtx.github.io/data_viz_encyclopoisson/',
        student: 'Aurore'
      },
      {
        image: 'Screenshot 2026-03-07 at 15-47-40.png',
        title: 'Rébecca',
        url: 'https://be-koo.github.io/Graphiques/',
        student: 'Rébecca'
      },
      {
        image: 'Screenshot 2026-03-07 at 15-50-57.png',
        title: 'TRACKS - Voyage Musical',
        url: 'https://tracksmap.vercel.app/',
        student: 'Arthur'
      },
      {
        image: 'Screenshot 2026-03-07 at 15-51-39.png',
        title: 'Popularité des morceaux hip-hop sur Spotify',
        url: 'https://wass-ym.github.io/design-de-donnes2/',
        student: 'Wacim'
      },
      {
        image: 'Screenshot 2026-03-07 at 15.25.06.png',
        title: 'Kpop France',
        url: 'https://yasmorenike.github.io/KpopFrance-data-design-/',
        student: 'Yasmine'
      },
      {
        image: 'Screenshot 2026-03-07 at 15.26.46.png',
        title: 'Consommation Électrique France',
        url: 'https://data.titouan.me',
        student: 'Titouan'
      },
      {
        image: 'Screenshot 2026-03-07 at 15.52.49.png',
        title: 'MONTAGNES TEMPORELLES 2026 !',
        url: 'https://milan69004.github.io/Rendue-JSBIN-travail-graphique-/',
        student: 'Milan'
      },
      {
        image: 'Screenshot 2026-03-08 at 13-50-22.png',
        title: 'James Cameron | Interactive Data Interface',
        url: 'https://marlon-nkt.github.io/cameroonfilms/',
        student: 'Marlon'
      },
      {
        image: 'Screenshot 2026-03-08 at 14-08-14.png',
        title: 'Émissions des GES',
        url: 'https://28032004.github.io/Projet-webgraphique/',
        student: 'Imane'
      },
      {
        image: "Screenshot 2026-03-08 at 14-09-44.png",
        title: "L'histoire des Jeux Olympiques",
        url: 'https://ar-arnaud.github.io/Projet-Web-Graphique-et-Design-des-Donn-e2/',
        student: 'Arnaud'
      },
      {
        image: 'Screenshot 2026-03-08 at 14-10-41.png',
        title: 'US Economy (1975–2024)',
        url: 'https://mohammad98sh.github.io/us-economic-indicators-viz/',
        student: 'Mohammad'
      },
      {
        image: 'Screenshot 2026-03-08 at 14-16-47.png',
        title: 'Cinéma africain',
        url: 'https://github.com/Mouhamedsogue/PAGE-WEB-INTERACTIVE.git',
        student: 'Mouhamed'
      },
      {
        image: 'Screenshot 2026-03-08 at 14-21-14.png',
        title: 'CinéMood Films et émotions',
        url: 'https://github.com/dantran0406/cinemood',
        student: 'Dan'
      },
      {
        image: 'Screenshot 2026-04-27 at 12.34.38.png',
        title: 'IMDB Top 1000 movies',
        url: 'https://elenerusadze.github.io/DesignDesDonnes/index.html',
        student: 'Elene'
      }
    ];

    const gallery = document.querySelector('#gallery');
    const viewer = document.querySelector('#viewer');
    const viewerImage = document.querySelector('#viewer-image');
    const viewerTitle = document.querySelector('#viewer-title');
    const viewerStudent = document.querySelector('#viewer-student');
    const viewerLiveLink = document.querySelector('#viewer-live-link');
    const viewerClose = document.querySelector('#viewer-close');

    function imageCandidates(fileName) {
      const trimmed = fileName.trim();
      const hasExtension = /\.[a-z0-9]+$/i.test(trimmed);
      const candidates = [trimmed];

      if (!hasExtension) {
        candidates.push(`${trimmed}.png`, `${trimmed}.jpg`, `${trimmed}.jpeg`, `${trimmed}.webp`);
      }

      return candidates.map(candidate => basePath + encodeURIComponent(candidate).replace(/%2F/g, '/'));
    }

    function attachImageFallback(img, candidates, fallbackContainer) {
      let index = 0;

      img.onload = () => {
        if (fallbackContainer) {
          fallbackContainer.classList.remove('is-missing');
        }
      };

      img.onerror = () => {
        index += 1;
        if (index < candidates.length) {
          img.src = candidates[index];
        } else if (fallbackContainer) {
          fallbackContainer.classList.add('is-missing');
        }
      };

      img.src = candidates[index];
    }

    function openViewer(project) {
      const candidates = imageCandidates(project.image);
      viewerTitle.textContent = project.title;
      viewerStudent.textContent = `By ${project.student}`;
      viewerLiveLink.href = project.url;
      viewerImage.alt = `${project.title}, by ${project.student}`;
      viewerImage.removeAttribute('src');
      attachImageFallback(viewerImage, candidates, null);

      if (typeof viewer.showModal === 'function') {
        viewer.showModal();
      } else {
        window.open(candidates[0], '_blank', 'noopener,noreferrer');
      }
    }

    function renderProject(project) {
      const card = document.createElement('article');
      card.className = 'card';

      const thumbButton = document.createElement('button');
      thumbButton.className = 'thumb-button';
      thumbButton.type = 'button';
      thumbButton.setAttribute('aria-label', `Open full view for ${project.title}`);

      const thumb = document.createElement('div');
      thumb.className = 'thumb';

      const img = document.createElement('img');
      img.loading = 'lazy';
      img.decoding = 'async';
      img.alt = `${project.title}, by ${project.student}`;
      attachImageFallback(img, imageCandidates(project.image), thumb);

      const fallback = document.createElement('div');
      fallback.className = 'image-fallback';
      fallback.textContent = 'Image not found';

      thumb.append(img, fallback);
      thumbButton.append(thumb);
      thumbButton.addEventListener('click', () => openViewer(project));

      const content = document.createElement('div');
      content.className = 'content';

      const headingGroup = document.createElement('div');
      const title = document.createElement('h2');
      title.className = 'project-title';
      title.textContent = project.title;

      const student = document.createElement('p');
      student.className = 'student';
      student.textContent = `By ${project.student}`;

      headingGroup.append(title, student);

      const actions = document.createElement('div');
      actions.className = 'actions';

      const viewButton = document.createElement('button');
      viewButton.className = 'button tonal';
      viewButton.type = 'button';
      viewButton.textContent = 'Open full view';
      viewButton.addEventListener('click', () => openViewer(project));

      const liveLink = document.createElement('a');
      liveLink.className = 'button filled';
      liveLink.href = project.url;
      liveLink.target = '_blank';
      liveLink.rel = 'noopener noreferrer';
      liveLink.textContent = 'Open live version';

      actions.append(viewButton, liveLink);
      content.append(headingGroup, actions);
      card.append(thumbButton, content);

      return card;
    }

    projects.forEach(project => gallery.append(renderProject(project)));

    viewerClose.addEventListener('click', () => viewer.close());

    viewer.addEventListener('click', event => {
      const dialogBounds = viewer.getBoundingClientRect();
      const clickedBackdrop =
        event.clientX < dialogBounds.left ||
        event.clientX > dialogBounds.right ||
        event.clientY < dialogBounds.top ||
        event.clientY > dialogBounds.bottom;

      if (clickedBackdrop) {
        viewer.close();
      }
    });
  </script>
</body>
</html>
